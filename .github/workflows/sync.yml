name: Sync CRM Feed Automatically

on:
  schedule:
    # Запуск щогодини (наприклад, 12:00, 13:00 тощо)
    - cron: '0 * * * *'
  workflow_dispatch: # Дозволяє за потреби запустити оновлення вручну

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fresh XML from Realtsoft
        run: |
          curl -s -L "https://crm-makler-kr.realtsoft.net/feed/xml?id=5" -o feed.xml

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync CRM feed [skip ci]" && git push)
