<!-- СКРИПТ ВІДПРАВКИ ЗАЯВКИ В TELEGRAM -->
    <script>
      const BOT_TOKEN = "8944481804:AAH9EK27VPC40QTGdz0_h1t2o6O-ahgvOKo";
      const CHAT_ID = "984427425";

      document.getElementById("leadForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "Надсилання...";

        const clientType = document.querySelector('input[name="client_type"]:checked')?.value || "Не вказано";
        const name = document.getElementById("client_name").value.trim();
        const phone = document.getElementById("client_phone").value.trim();
        const districtSelect = document.getElementById("district");
        const district = districtSelect.options[districtSelect.selectedIndex].text;
        const comment = document.getElementById("description").value.trim() || "Не вказано";

        const text = `🔔 *Нова заявка з сайту Makler KR!*\n\n` +
                     `👤 *Тип клієнта:* ${clientType}\n` +
                     `📝 *Ім'я:* ${name}\n` +
                     `📞 *Телефон:* ${phone}\n` +
                     `📍 *Район:* ${district}\n` +
                     `💬 *Опис/Коментар:* ${comment}`;

        try {
          const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: text,
              parse_mode: "Markdown"
            })
          });

          if (response.ok) {
            // Перенаправляємо клієнта на стильний екран подяки
            window.location.href = "thanks.html";
          } else {
            alert("Помилка при відправці. Будь ласка, зателефонуйте Андрію за номером у шапці.");
            submitBtn.disabled = false;
            submitBtn.textContent = "Надіслати заявку";
          }
        } catch (error) {
          alert("Сталася помилка з'єднання. Будь ласка, зателефонуйте Андрію прямо зараз.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Надіслати заявку";
        }
      });
    </script>
